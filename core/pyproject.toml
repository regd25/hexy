[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hexy-framework"
version = "0.1.0"
description = "Framework de contexto semántico para IA con ontologías y explicabilidad"
readme = "README.md"
authors = [
    {name = "Hexy Team", email = "dev@hexy-framework.org"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: CGI Tools/Libraries",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
keywords = ["AI", "semantic-web", "ontology", "context-engineering", "RDF", "SPARQL"]
dependencies = [
    "owlready2>=0.44",
    "rdflib>=7.0.0",
    "networkx>=3.2.1",
    "spacy>=3.7.0",
    "fastapi>=0.109.0",
    "pydantic>=2.5.0",
    "redis>=5.0.0",
    "httpx>=0.26.0",
    "click>=8.1.7"
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.21.1",
    "black>=23.12.1",
    "isort>=5.13.2",
    "mypy>=1.8.0"
]
full = [
    "nltk>=3.8.1",
    "sqlmodel>=0.0.14",
    "celery>=5.3.4",
    "ontospy>=2.0.0",
    "streamlit>=1.29.0",
    "openai>=1.7.0",
    "anthropic>=0.8.0"
]

[project.urls]
Homepage = "https://github.com/regd25/hexy"
Documentation = "https://hexy-framework.readthedocs.io"
Repository = "https://github.com/regd25/hexy"
Issues = "https://github.com/regd25/hexy/issues"

[project.scripts]
hexy = "hexy.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hexy*"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true